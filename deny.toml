# cargo-deny configuration.
# Run: cargo deny check        (or: cargo deny check licenses advisories bans sources)

[graph]
all-features = true

[licenses]
version = 2
# This workspace is Apache-2.0. Dependencies are restricted to permissive licenses;
# add entries here (with justification) rather than disabling the check.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.93

[advisories]
version = 2
# Advisories v2 already errors on vulnerable, unmaintained and unsound
# advisories (and deprecated the old per-category warn levels); the explicit
# settings below pin that intent. `all` covers transitive dependencies too, so
# downgrading to `workspace` would be a deliberate relaxation. Any accepted
# finding must be added to `ignore` with a justification.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    #"RUSTSEC-0000-0000",
]

[bans]
# Duplicated dependencies inflate the binary and mask version conflicts;
# keep this visible and resolve them periodically.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # Example: { name = "openssl", reason = "use rustls instead" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
