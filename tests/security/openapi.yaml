openapi: 3.0.3
info:
  title: Conductor API
  description: >-
    Scan surface for OWASP ZAP. The upload body is multipart; activation and
    execution accept bounded JSON. Every /v1 route requires the operator
    bearer token.
  version: 0.1.0
servers:
  - url: https://conductor:8443
    description: Test host from tests/security/compose.yml
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: Liveness only; no version or topology detail.
  /readyz:
    get:
      operationId: readyz
      responses:
        "200":
          description: >-
            Cached readiness reports the shared database migrated/probeable
            and the scheduler hook ready. The probe does no database work.
        "503":
          description: Not ready; fixed `unavailable` body with no details.
  /v1/packages:
    post:
      operationId: uploadPackage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [package, key_id, signature]
              properties:
                package:
                  type: string
                  format: binary
                key_id:
                  type: string
                  maxLength: 256
                signature:
                  type: string
                format_version:
                  type: string
                  maxLength: 16
      responses:
        "201":
          description: Package validated, promoted, and registered.
        "400":
          description: Malformed multipart, field, envelope, or version.
        "401":
          description: Missing/invalid bearer or package signature.
        "409":
          description: Version already registered with different bytes.
        "413":
          description: Body or streamed package exceeds the policy bound.
        "422":
          description: Well-formed but semantically invalid package.
        "503":
          description: Upload slots saturated or validation timed out.
  /v1/modules/{module_id}/activate:
    post:
      operationId: activateModule
      security:
        - bearerAuth: []
      parameters:
        - name: module_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        "200":
          description: Active version persisted.
          content:
            application/json:
              schema:
                type: object
                required: [module_id, version, digest, signer_key_id]
                properties:
                  module_id:
                    type: string
                  version:
                    type: string
                  digest:
                    type: string
                    pattern: "^[0-9a-f]{64}$"
                  signer_key_id:
                    type: string
        "400":
          description: Malformed or oversized JSON body.
        "401":
          description: Missing or invalid bearer token.
        "404":
          description: The requested module version is not registered.
        "413":
          description: JSON body exceeds the 1 MiB route bound.
        "422":
          description: Registered version is not intact or its runtime is not allowed.
        "500":
          description: Internal host, storage, or missing-artifact failure; generic body only.
        "503":
          description: Request timed out or activation capacity is saturated.
  /v1/modules/{module_id}/executions:
    post:
      operationId: executeModule
      security:
        - bearerAuth: []
      parameters:
        - name: module_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [function]
              properties:
                version:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: Omit to use the module's active version.
                function:
                  type: string
                  minLength: 1
                  maxLength: 256
                configuration:
                  type: object
                  description: Job configuration; never recorded in audit.
                deadline_secs:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Omitted means 30 seconds, clamped to the host maximum when that is lower; explicit values above the host maximum are refused.
      responses:
        "200":
          description: Execution completed or a spawned worker reported an outcome.
          content:
            application/json:
              schema:
                type: object
                required:
                  [execution_id, module_id, version, digest, outcome, stdout, stderr, duration_ms]
                properties:
                  execution_id:
                    type: string
                  module_id:
                    type: string
                  version:
                    type: string
                  digest:
                    type: string
                    pattern: "^[0-9a-f]{64}$"
                  outcome:
                    type: string
                    enum:
                      - succeeded
                      - failed
                      - timed_out
                      - cancelled
                      - worker_error
                      - protocol_violation
                  stdout:
                    type: string
                  stderr:
                    type: string
                  duration_ms:
                    type: integer
                    format: int64
        "400":
          description: Malformed JSON, invalid identity, or over-maximum deadline.
        "401":
          description: Missing or invalid bearer token.
        "404":
          description: Module/version is not registered or has no active version.
        "413":
          description: JSON body exceeds the 1 MiB route bound.
        "422":
          description: Legacy manifest, runtime/integrity/manifest/archive refusal.
        "500":
          description: Internal host, storage, or missing-artifact failure; generic body only.
        "503":
          description: Execution capacity saturated.
  /v1/executions:
    get:
      operationId: listExecutions
      description: >-
        Durable execution metadata, newest first. No stdout, stderr, or
        configuration is stored or returned.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: Newest-first page of execution receipts.
          content:
            application/json:
              schema:
                type: object
                required: [executions, limit, offset]
                properties:
                  executions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExecutionRecord"
                  limit:
                    type: integer
                    format: int64
                  offset:
                    type: integer
                    format: int64
        "400":
          description: Invalid pagination (stable `invalid_pagination` code).
        "401":
          description: Missing or invalid bearer token.
        "500":
          description: History read failure; generic body only.
  /v1/executions/{execution_id}:
    get:
      operationId: getExecution
      security:
        - bearerAuth: []
      parameters:
        - name: execution_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9_-]+$"
      responses:
        "200":
          description: One durable execution receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRecord"
        "400":
          description: Invalid execution id (stable `invalid_execution_id` code).
        "401":
          description: Missing or invalid bearer token.
        "404":
          description: No execution with that id (stable `execution_not_found` code).
        "500":
          description: History read failure; generic body only.
  /v1/jobs:
    get:
      operationId: listJobs
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            format: int64
        - name: offset
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Newest-first job page; payload is never returned.
        "400":
          description: Invalid pagination (stable `invalid_pagination` code).
        "401":
          description: Missing or invalid bearer token.
        "500":
          description: Job read failure; generic body only.
    post:
      operationId: createJob
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [module_id, version, function, trigger]
              properties:
                module_id:
                  type: string
                version:
                  type: string
                function:
                  type: string
                trigger:
                  description: Manual, interval, or UTC five-field cron trigger.
                  oneOf:
                    - type: object
                      required: [kind]
                      properties:
                        kind:
                          type: string
                          enum: [manual]
                      additionalProperties: false
                    - type: object
                      required: [kind, interval_secs]
                      properties:
                        kind:
                          type: string
                          enum: [interval]
                        interval_secs:
                          type: integer
                          format: int64
                          minimum: 1
                          maximum: 31536000
                      additionalProperties: false
                    - type: object
                      required: [kind, expression]
                      properties:
                        kind:
                          type: string
                          enum: [cron]
                        expression:
                          type: string
                          minLength: 1
                          maxLength: 256
                      additionalProperties: false
                payload:
                  type: object
                  nullable: true
                enabled:
                  type: boolean
      responses:
        "201":
          description: Durable job created; payload is not echoed.
        "400":
          description: Invalid identity, trigger, payload, or body.
        "401":
          description: Missing or invalid bearer token.
        "413":
          description: Body exceeds the route limit.
        "503":
          description: Job count bound reached (`server_busy`).
  /v1/jobs/{job_id}/enable:
    post:
      operationId: enableJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job view with enabled=true.
        "401":
          description: Missing or invalid bearer token.
        "404":
          description: Job not found (`job_not_found`).
  /v1/jobs/{job_id}/disable:
    post:
      operationId: disableJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job view with enabled=false; queued runs are refused.
        "401":
          description: Missing or invalid bearer token.
        "404":
          description: Job not found (`job_not_found`).
  /v1/jobs/{job_id}/trigger:
    post:
      operationId: triggerJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: Run enqueued (`job_id`, `run_id`, `state=queued`).
        "401":
          description: Missing or invalid bearer token.
        "404":
          description: Job not found (`job_not_found`).
        "409":
          description: Job is disabled (`job_disabled`).
        "503":
          description: Scheduler unavailable or queue full.
  /v1/jobs/{job_id}/runs:
    get:
      operationId: listJobRuns
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: limit
          in: query
          schema:
            type: integer
            format: int64
        - name: offset
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Newest-first run page; no payload/stdout/stderr.
        "400":
          description: Invalid pagination.
        "401":
          description: Missing or invalid bearer token.
        "404":
          description: Job not found (`job_not_found`).
        "500":
          description: Run read failure; generic body only.
components:
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._+-]+$"
  schemas:
    ExecutionRecord:
      type: object
      required:
        - execution_id
        - module_id
        - version
        - digest
        - function
        - outcome
        - started_at_ms
        - finished_at_ms
        - duration_ms
      properties:
        execution_id:
          type: string
        module_id:
          type: string
        version:
          type: string
        digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
        function:
          type: string
        outcome:
          type: string
          enum:
            - succeeded
            - failed
            - timed_out
            - cancelled
            - worker_error
            - protocol_violation
        started_at_ms:
          type: integer
          format: int64
        finished_at_ms:
          type: integer
          format: int64
        duration_ms:
          type: integer
          format: int64
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
