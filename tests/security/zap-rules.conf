# ZAP rule policy for the conductor API scan.
#
# Transport-header rules are FAIL: a regression that drops one of the headers
# the route table pins should fail the scan, not just warn. Rules that are
# intentional API behavior are IGNORE.

# Merge gates: required security headers.
10020	FAIL	(X-Frame-Options Header Not Set)
10021	FAIL	(X-Content-Type-Options Header Missing)
10035	FAIL	(Strict-Transport-Security Header Not Set)
90004	FAIL	(Cross-Origin-Resource-Policy Header Missing or Invalid)

# Intentional for an authenticated, non-cacheable JSON API.
10015	IGNORE	(Re-examine Cache-control Directives)
10049	IGNORE	(Non-Storable Content)
100000	IGNORE	(A Client Error response code was returned by the server)
