[package]
name = "conductor"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Modular-monolith job host (unstable scaffold)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ed25519-dalek = "2"
sha2 = "0.10"
zip = "2"
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = ["trace", "limit", "timeout"] }
base64 = "0.23.1"
bytes = "1.12.1"
unicode-normalization = "0.1.25"
