[package]
name = "conductor"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Modular-monolith job host (unstable scaffold)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ed25519-dalek = "2"
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = ["trace", "limit", "timeout", "set-header", "catch-panic", "request-id"] }
base64 = "0.23.1"
bytes = "1.12.1"
unicode-normalization = "0.1.25"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
subtle = "2.6.1"
tokio-stream = { version = "0.1.19", features = ["sync"] }

[target.'cfg(unix)'.dependencies]
# Process-group termination for worker descendants (`killpg`); Unix-only,
# so it is not a portable dependency.
libc = "0.2"

[dev-dependencies]
rcgen = "0.14.10"
